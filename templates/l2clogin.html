<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-semibold text-center text-gray-700 mb-6">Login</h1>
        
        <form method="POST">
            <label for="email" class="block text-gray-700 font-medium mb-2">E-mail:</label>
            <input type="email" id="email" name="email" required class="w-full p-3 border border-gray-300 rounded-lg mb-4" placeholder="Digite seu e-mail">
            
            <label for="senha" class="block text-gray-700 font-medium mb-2">Senha:</label>
            <input type="password" id="senha" name="senha" required class="w-full p-3 border border-gray-300 rounded-lg mb-6" placeholder="Digite sua senha">
            
            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">Entrar</button>
        </form>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="mt-4 space-y-2 text-red-700">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
