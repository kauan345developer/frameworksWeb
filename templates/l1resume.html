<!-- templates/resume.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{{ dev.name }} - Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
            <!-- Header Section -->
            <div class="md:flex">
                <div class="md:flex-shrink-0">
                    <img class="h-48 w-48 object-cover rounded-full m-6" 
                         src="{{ url_for('static', filename='images/' + dev.photo) }}" 
                         alt="{{ dev.name }}">
                </div>
                <div class="p-8">
                    <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold">
                        {{ dev.title }}
                    </div>
                    <h1 class="block mt-1 text-3xl font-bold text-black">
                        {{ dev.name }}
                    </h1>
                    <a href="{{ dev.github }}" 
                       class="mt-2 text-blue-500 hover:text-blue-600 inline-flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        GitHub Profile
                    </a>
                </div>
            </div>
            
            <!-- Tech Stack Section -->
            <div class="px-8 py-6 border-t border-gray-200">
                <h2 class="text-xl font-bold mb-4">Tech Stack</h2>
                <div class="flex flex-wrap gap-2">
                    {% for stack in dev.stacks %}
                    <span class="px-3 py-1 bg-gray-200 rounded-full text-sm">
                        {{ stack }}
                    </span>
                    {% endfor %}
                </div>
            </div>

            <!-- Experience Section -->
            <!-- <div class="px-8 py-6 border-t border-gray-200">
                <h2 class="text-xl font-bold mb-4">Experience</h2>
                <ul class="space-y-2">
                    {% for exp in dev.experience %}
                    <li class="text-gray-600">{{ exp }}</li>
                    {% endfor %}
                </ul>
            </div> -->
        </div>
    </div>
</body>
</html>
