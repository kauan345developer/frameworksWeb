<!-- templates/curriculos.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Developer Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Development Team</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for dev_id, dev in developers.items() %}
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <div class="p-6">
                    <img class="h-32 w-32 rounded-full mx-auto mb-4 object-cover" 
                         src="{{ url_for('static', filename='images/' + dev.photo) }}" 
                         alt="{{ dev.name }}">
                    <div class="text-center">
                        <h2 class="text-xl font-semibold text-gray-800">{{ dev.name }}</h2>
                        <p class="text-indigo-600 mb-2">{{ dev.title }}</p>
                        
                        <div class="flex flex-wrap justify-center gap-2 mb-4">
                            {% for stack in dev.stacks[:3] %}
                            <span class="px-2 py-1 bg-gray-200 rounded-full text-xs">
                                {{ stack }}
                            </span>
                            {% endfor %}
                        </div>
                        
                        <a href="{{ url_for('l1resume', dev_name=dev_id) }}" 
                           class="inline-block bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                            View Resume
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
