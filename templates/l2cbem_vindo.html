<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-semibold text-center text-gray-700 mb-6">Bem-vindo, {{ usuario.nome }}!</h1>
        <p class="text-center text-gray-600">Você está logado como {{ usuario.email }}.</p>
        <p class="text-center text-gray-600">Idade: {{ usuario.idade }}</p>
        <p class="text-center text-gray-600">Endereço: {{ usuario.endereco }}</p>
        
        <div class="mt-6 text-center">
            <a href="{{ url_for('l2clogout') }}" class="bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 transition">Sair</a>
        </div>
    </div>
</body>
</html>
