<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Formulário Gerado</title>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Preencha os dados</h2>
        <form method="post" action="/l2form" class="space-y-4">
            {{ form_fields | safe }}
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-700">Enviar</button>
        </form>
        {% if data %}
        <div class="mt-6">
            <h3 class="text-xl font-bold mb-2">Dados Recebidos:</h3>
            <ul class="space-y-2">
                {% for key, value in data.items() %}
                <li><strong>{{ key }}:</strong> {{ value }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>
</body>
</html>
