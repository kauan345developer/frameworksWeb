<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="">
    <h1>Meu Portfólio</h1>
    <div class="projetos-container">
        {% for projeto in projetos %}
        <div class="projeto-card" data-projeto='{{ projeto | tojson }}'>
            <h2>{{ projeto.nome }}</h2>
            <p>Data: {{ projeto.data }}</p>
        </div>
        {% endfor %}
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-titulo"></h2>
            <p id="modal-descricao"></p>

            <a id="modal-link"  class="modal-botao">Ver Projeto</a>
        </div>
    </div>

    <script>
        // JavaScript para controlar o modal
        const modal = document.getElementById("modal");
        const modalTitulo = document.getElementById("modal-titulo");
        const modalDescricao = document.getElementById("modal-descricao");
        const modalLink = document.getElementById("modal-link");

        // Abrir modal ao clicar em um card
        document.querySelectorAll(".projeto-card").forEach(card => {
            card.addEventListener("click", () => {
                const projeto = JSON.parse(card.getAttribute("data-projeto"));
                modalTitulo.textContent = projeto.nome;
                modalDescricao.textContent = projeto.descricao;
                modalLink.href = projeto.link;
                modal.style.display = "block";

                if (projeto.showButton) {
                    modalLink.style.display = "inline-block";
                } else {
                    modalLink.style.display = "none";
                }
            });
        });

        // Fechar modal ao clicar no "X"
        document.querySelector(".close").addEventListener("click", () => {
            modal.style.display = "none";
        });

        // Fechar modal ao clicar fora dele
        window.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>
</body>
</html>
