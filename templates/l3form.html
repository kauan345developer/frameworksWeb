<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">Formulário de Login</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label for="nome" class="block text-sm font-medium text-gray-600">Nome:</label>
                <input type="text" id="nome" name="nome" required 
                    class="mt-1 p-2 w-full border rounded-md focus:ring-2 focus:ring-blue-400">
            </div>
            <div>
                <label for="senha" class="block text-sm font-medium text-gray-600">Senha:</label>
                <input type="password" id="senha" name="senha" required 
                    class="mt-1 p-2 w-full border rounded-md focus:ring-2 focus:ring-blue-400">
            </div>
            <button type="submit" 
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition">
                Entrar
            </button>
        </form>
        <p id="message" class="text-center mt-4 text-red-500 font-semibold"></p>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const nome = document.getElementById("nome").value;
            const senha = document.getElementById("senha").value;
            
            fetch("/l3auth", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ nome, senha })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("message").textContent = data.message || data.error;
            })
            .catch(error => console.error("Erro:", error));
        });
    </script>
</body>
</html>
