<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">Mini-Blog</h2>

        <form method="POST" class="space-y-4">
            <input type="text" name="titulo" placeholder="Título do Post" required
                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400">
            <textarea name="conteudo" placeholder="Escreva algo..." required
                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400"></textarea>
            <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition">
                Postar
            </button>
        </form>

        <h3 class="text-xl font-semibold mt-6">Posts Recentes</h3>
        {% for post in posts %}
        <div class="bg-gray-50 p-4 rounded-lg shadow mt-4">
            <h4 class="text-lg font-bold">{{ post.titulo }}</h4>
            <p class="text-gray-700">{{ post.conteudo }}</p>
            <p class="text-sm text-gray-500 mt-2">{{ post.data }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
